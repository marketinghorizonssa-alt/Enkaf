name: Temporary Whisper Model Fetch

on:
  push:
    branches:
      - tmp-whisper-model-20260826

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download multilingual Whisper small q5_1
        run: |
          curl -L --fail --retry 3 \
            -o ggml-small-q5_1.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin
          test -s ggml-small-q5_1.bin
          ls -lh ggml-small-q5_1.bin
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-q5_1
          path: ggml-small-q5_1.bin
          retention-days: 1
